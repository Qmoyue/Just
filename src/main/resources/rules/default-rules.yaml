rules:
  # ---- sink 起点 ----
  - id: JUST-SINK-COMMAND-EXEC-RUNTIME
    kind: sink
    category: COMMAND_EXEC
    severity: HIGH
    match:
      call: { owner: "java/lang/Runtime", name: "exec" }
    tainted: [{arg: 0}]

  - id: JUST-SINK-COMMAND-EXEC-PROCESSBUILDER
    kind: sink
    category: COMMAND_EXEC
    severity: HIGH
    match:
      call: { owner: "java/lang/ProcessBuilder", name: "start" }
    tainted: [{receiver: true}]

  - id: JUST-SINK-CLASSLOAD-FORNAME
    kind: sink
    category: CODE_EXEC
    severity: HIGH
    match:
      call: { owner: "java/lang/Class", name: "forName" }
    tainted: [{arg: 0}]

  - id: JUST-SINK-CLASSLOAD-NEWINSTANCE
    kind: sink
    category: CODE_EXEC
    severity: HIGH
    match:
      call: { owner: "java/lang/Class", name: "newInstance" }
    tainted: [{receiver: true}]

  - id: JUST-SINK-TEMPLATESIMPL
    kind: sink
    category: CODE_EXEC
    severity: HIGH
    match:
      call: { owner: "com/sun/org/apache/xalan/internal/xsltc/trax/TemplatesImpl", name: ~"getOutputProperties|newTransformer" }
    tainted: [{receiver: true}]

  - id: JUST-SINK-JNDI-LOOKUP
    kind: sink
    category: JNDI
    severity: HIGH
    match:
      call: { owner: "javax/naming/Context", name: ~"lookup|list|bind" }
    tainted: [{arg: 0}]

  - id: JUST-SINK-REFLECTIVE-INVOKE
    kind: sink
    category: REFLECTIVE_INVOKE
    severity: HIGH
    match:
      call: { owner: "java/lang/reflect/Method", name: "invoke" }
    tainted: [{arg: 0}, {arg: 1}]

  - id: JUST-SINK-REFLECTIVE-NEWINSTANCE
    kind: sink
    category: REFLECTIVE_INVOKE
    severity: HIGH
    match:
      call: { owner: "java/lang/reflect/Constructor", name: "newInstance" }
    tainted: [{arg: 0}]

  - id: JUST-SINK-CLASSLOADER-DEFINECLASS
    kind: sink
    category: CODE_EXEC
    severity: HIGH
    match:
      call: { owner: "java/lang/ClassLoader", name: "defineClass" }
    tainted: [{arg: 1}]

  - id: JUST-SINK-SCRIPT-ENGINE
    kind: sink
    category: CODE_EXEC
    severity: HIGH
    match:
      call: { owner: "javax/script/ScriptEngine", name: "eval" }
    tainted: [{arg: 0}]

  - id: JUST-SINK-SCRIPT-ENGINEMANAGER
    kind: sink
    category: CODE_EXEC
    severity: MEDIUM
    match:
      call: { owner: "javax/script/ScriptEngineManager", name: "getEngineByName" }
    tainted: [{arg: 0}]

  - id: JUST-SINK-TEMPLATESIMPL-OLD-PACKAGE
    kind: sink
    category: CODE_EXEC
    severity: HIGH
    match:
      call: { owner: "org/apache/xalan/xsltc/trax/TemplatesImpl", name: ~"getOutputProperties|newTransformer" }
    tainted: [{receiver: true}]

  - id: JUST-SINK-BCEL-CLASSLOADER
    kind: sink
    category: CODE_EXEC
    severity: HIGH
    match:
      call: { owner: "com/sun/org/apache/bcel/internal/util/ClassLoader", name: ~"loadClass|createClass" }
    tainted: [{arg: 0}]

  - id: JUST-SINK-HUTOOL-DESERIALIZE
    kind: sink
    category: DESERIALIZE
    severity: HIGH
    match:
      call: { owner: "cn/hutool/core/util/ObjectUtil", name: "deserialize" }
    tainted: [{arg: 0}]

  - id: JUST-SINK-HUTOOL-SERIALIZEUTIL
    kind: sink
    category: DESERIALIZE
    severity: HIGH
    match:
      call: { owner: "cn/hutool/core/util/SerializeUtil", name: "deserialize" }
    tainted: [{arg: 0}]

  - id: JUST-SINK-COMMONS-SERIALIZATIONUTILS
    kind: sink
    category: DESERIALIZE
    severity: HIGH
    match:
      call: { owner: "org/apache/commons/lang3/SerializationUtils", name: ~"deserialize|roundtrip" }
    tainted: [{arg: 0}]

  - id: JUST-SINK-SPRING-SERIALIZATIONUTILS
    kind: sink
    category: DESERIALIZE
    severity: HIGH
    match:
      call: { owner: "org/springframework/util/SerializationUtils", name: "deserialize" }
    tainted: [{arg: 0}]

  - id: JUST-SINK-JMX-INVOKE
    kind: sink
    category: CODE_EXEC
    severity: HIGH
    match:
      call: { owner: "javax/management/MBeanServer", name: "invoke" }
    tainted: [{arg: 1}, {arg: 2}]

  - id: JUST-SINK-METHODHANDLE-INVOKE
    kind: sink
    category: REFLECTIVE_INVOKE
    severity: HIGH
    match:
      call: { owner: "java/lang/invoke/MethodHandle", name: ~"invoke.*" }
    tainted: [{receiver: true}]

  - id: JUST-SINK-SPEL-GETVALUE
    kind: sink
    category: CODE_EXEC
    severity: HIGH
    match:
      call: { owner: "org/springframework/expression/Expression", name: "getValue" }
    tainted: [{receiver: true}]

  - id: JUST-SINK-GROOVY-SHELL-EVALUATE
    kind: sink
    category: CODE_EXEC
    severity: HIGH
    match:
      call: { owner: "groovy/lang/GroovyShell", name: "evaluate" }
    tainted: [{arg: 0}]

  - id: JUST-SINK-GROOVY-CLASSLOADER
    kind: sink
    category: CODE_EXEC
    severity: HIGH
    match:
      call: { owner: "groovy/lang/GroovyClassLoader", name: ~"parseClass|defineClass" }
    tainted: [{arg: 0}]

  - id: JUST-SINK-OGNL
    kind: sink
    category: CODE_EXEC
    severity: HIGH
    match:
      call: { owner: "ognl/Ognl", name: ~"getValue|parseExpression" }
    tainted: [{arg: 0}]

  - id: JUST-SINK-MVEL-EVAL
    kind: sink
    category: CODE_EXEC
    severity: HIGH
    match:
      call: { owner: "org/mvel2/MVEL", name: ~"eval|evalFile" }
    tainted: [{arg: 0}]

  - id: JUST-SINK-EL-PROCESSOR
    kind: sink
    category: CODE_EXEC
    severity: HIGH
    match:
      call: { owner: "javax/el/ELProcessor", name: ~"eval|getValue" }
    tainted: [{arg: 0}]

  - id: JUST-SINK-XMLDECODER
    kind: sink
    category: DESERIALIZE
    severity: HIGH
    match:
      call: { owner: "java/beans/XMLDecoder", name: "readObject" }
    tainted: [{receiver: true}]

  # ---- magic-entry 终点 ----
  - id: JUST-ENTRY-READOBJECT
    kind: magic-entry
    entryKind: readObject
    match:
      method: { name: "readObject", descriptor: "(Ljava/io/ObjectInputStream;)V" }
      class: { implements: "java/io/Serializable" }

  - id: JUST-ENTRY-READRESOLVE
    kind: magic-entry
    entryKind: readResolve
    match:
      method: { name: "readResolve", descriptor: "()Ljava/lang/Object;" }
      class: { implements: "java/io/Serializable" }

  - id: JUST-ENTRY-READOBJECTNODATA
    kind: magic-entry
    entryKind: readObjectNoData
    match:
      method: { name: "readObjectNoData", descriptor: "()V" }
      class: { implements: "java/io/Serializable" }

  - id: JUST-ENTRY-HASHCODE
    kind: magic-entry
    entryKind: hashCode
    match:
      method: { name: "hashCode", descriptor: "()I" }
      class: { implements: "java/io/Serializable" }

  - id: JUST-ENTRY-EQUALS
    kind: magic-entry
    entryKind: equals
    match:
      method: { name: "equals", descriptor: "(Ljava/lang/Object;)Z" }
      class: { implements: "java/io/Serializable" }

  - id: JUST-ENTRY-COMPARETO
    kind: magic-entry
    entryKind: compareTo
    match:
      method: { name: "compareTo", descriptor: "(Ljava/lang/Object;)I" }
      class: { implements: "java/io/Serializable" }

  - id: JUST-ENTRY-TOSTRING
    kind: magic-entry
    entryKind: toString
    match:
      method: { name: "toString", descriptor: "()Ljava/lang/String;" }
      class: { implements: "java/io/Serializable" }

  - id: JUST-ENTRY-FINALIZE
    kind: magic-entry
    entryKind: finalize
    match:
      method: { name: "finalize", descriptor: "()V" }
      class: { implements: "java/io/Serializable" }

  - id: JUST-ENTRY-PROXY-INVOKE
    kind: magic-entry
    entryKind: proxyInvoke
    match:
      method: { name: "invoke", descriptor: "(Ljava/lang/Object;Ljava/lang/reflect/Method;[Ljava/lang/Object;)Ljava/lang/Object;" }
      class: { implements: "java/lang/reflect/InvocationHandler" }

  - id: JUST-ENTRY-COMPARE
    kind: magic-entry
    entryKind: compare
    match:
      method: { name: "compare", descriptor: "(Ljava/lang/Object;Ljava/lang/Object;)I" }
      class: { implements: "java/io/Serializable" }

  - id: JUST-ENTRY-READEXTERNAL
    kind: magic-entry
    entryKind: readExternal
    match:
      method: { name: "readExternal", descriptor: "(Ljava/io/ObjectInput;)V" }
      class: { implements: "java/io/Externalizable" }

  - id: JUST-ENTRY-VALIDATEOBJECT
    kind: magic-entry
    entryKind: validateObject
    match:
      method: { name: "validateObject", descriptor: "()V" }
      class: { implements: "java/io/ObjectInputValidation" }
